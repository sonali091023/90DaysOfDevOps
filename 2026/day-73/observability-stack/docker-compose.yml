services:
  db:
    image: postgres:16
    container_name: db

    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jiohotstar

    ports:
      - "5432:5432"

  jiohotstar:
    image: sonali0910/jiohotstar:latest
    container_name: jiohotstar

    environment:
      DATABASE_URL: postgresql://user:password@db:5432/jiohotstar
      SECRET_KEY: mysecret

    ports:
      - "8081:5000"

    depends_on:
      - db

    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

volumes:
  prometheus_data:

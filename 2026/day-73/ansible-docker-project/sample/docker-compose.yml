version: "3.9"

services:
  web:
    image: sonali0910/jiohotstar:latest
    ports:
      - "8081:5000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/jiohotstar
      SECRET_KEY: your-secret-key
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jiohotstar
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

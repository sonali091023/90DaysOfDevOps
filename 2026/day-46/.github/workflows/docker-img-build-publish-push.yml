name: Docker Build & Push & Publish

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      #Set image name + short SHA
      - name: Set image variables
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/my-app-build-push-publish" >> $GITHUB_ENV
          echo "IMAGE_TAG_SHA=sha-$SHORT_SHA" >> $GITHUB_ENV

      #Build image with BOTH tags
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:$IMAGE_TAG_SHA \
            .

      - name: Push Docker image to main branch
        if: github.ref == 'refs/heads/main'     #Run this step ONLY if the branch is main
        run: echo "Pushing image to main branch" && docker push $IMAGE_NAME:latest && docker push $IMAGE_NAME:$IMAGE_TAG_SHA

      - name: Pushing image on main branch so Skipping for feature branch
        if: github.ref != 'refs/heads/main'
        run: echo "Not main branch → skipping push"

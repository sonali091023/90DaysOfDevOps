services:
  web:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "8080:80"                         #Mapping host port 8080 with containers 80 port
    volumes:
      - ./html:/usr/share/nginx/html      #./html dir created in current dir and that is getting mapped with /usr/share/nginx/htm
    restart: always

apiVersion: v1
kind: Pod
metadata:
  name: pvc-pod
spec:
  containers:
  - name: app
    image: busybox
    command: ["/bin/sh", "-c"]
    args:
      - echo "Hello from second Pod" >> /data/message.txt && sleep 3600
    volumeMounts:
      - mountPath: /data
        name: storage
  volumes:
    - name: storage
      persistentVolumeClaim:
        claimName: demo-pvc   # <-- replace with your PVC name

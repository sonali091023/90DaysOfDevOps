---
# Docker Dependencies
- name: Install Docker dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
    state: present
    update_cache: true
  tags:
    - docker

# Docker Installation
- name: Install Docker
  apt:
    name: docker.io
    state: present
    update_cache: true
  tags:
    - docker

- name: Start and enable Docker service
  service:
    name: docker
    state: started
    enabled: true
  tags:
    - docker

# User Configuration
- name: Add deploy user to docker group
  user:
    name: deploy
    groups: docker
    append: true
  tags:
    - docker

- name: Reset SSH connection to apply group membership
  meta: reset_connection
  tags:
    - docker

# Docker Tools
- name: Install Docker Python SDK
  apt:
    name: python3-docker
    state: present
  tags:
    - docker

- name: Install Docker Compose
  apt:
    name: docker-compose
    state: present
  tags:
    - docker

# Verify Docker Access
- name: Verify Docker daemon is accessible
  command: docker info
  register: docker_info
  changed_when: false
  tags:
    - docker

# Docker Hub Authentication (Optional)
- name: Log in to Docker Hub
  community.docker.docker_login:
    username: "{{ vault_docker_username }}"
    password: "{{ vault_docker_password }}"
  become_user: deploy
  when: vault_docker_username is defined
  tags:
    - docker

# Container Image
- name: Pull application image
  become: true
  command: docker pull {{ docker_app_image }}:{{ docker_app_tag }}
  tags:
    - docker

# Container Management

- name: Remove existing container if present
  become: true
  command: docker rm -f {{ docker_app_name }}
  ignore_errors: true
  tags:
    - docker

- name: Run application container
  become: true
  command: >
    docker run -d
    --name {{ docker_app_name }}
    --restart always
    -p {{ docker_app_port }}:{{ docker_container_port }}
    {{ docker_app_image }}:{{ docker_app_tag }}
  tags:
    - docker

# Health Check
- name: Wait for container to be healthy
  uri:
    url: "http://localhost:{{ docker_app_port }}"
    status_code: 200
  register: health_check
  retries: 5
  delay: 3
  until: health_check.status == 200
  tags:
    - docker



---
# =========================
# 1. INSTALL DOCKER STACK
# =========================

- name: Install Docker dependencies
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - python3-pip
    state: present
    update_cache: true
  tags: [docker]

- name: Install Docker
  apt:
    name: docker.io
    state: present
    update_cache: true
  tags: [docker]

- name: Start and enable Docker service
  service:
    name: docker
    state: started
    enabled: true
  tags: [docker]

- name: Install Docker Python SDK
  apt:
    name: python3-docker
    state: present
  tags: [docker]

- name: Install Docker Compose
  apt:
    name: docker-compose
    state: present
  tags: [docker]

# =========================
# 2. USER CONFIG
# =========================

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: true
  tags: [docker]

- name: Reset SSH connection to apply docker group
  meta: reset_connection
  tags: [docker]

# =========================
# 3. DOCKER NETWORK
# =========================

- name: Create Docker network
  community.docker.docker_network:
    name: jio-network
    driver: bridge
    state: present
  environment:
    DOCKER_HOST: unix:///var/run/docker.sock
  tags: [docker]

# =========================
# 4. POSTGRES DATABASE
# =========================

- name: Run PostgreSQL container
  community.docker.docker_container:
    name: db
    image: postgres:16
    networks:
      - name: jio-network
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: jiohotstar
    restart_policy: always
  tags: [docker]

- name: Wait for postgres startup
  shell: |
    docker exec db pg_isready -U postgres
  register: postgres_ready
  retries: 12
  delay: 5
  until: postgres_ready.rc == 0

# =========================
# 5. APPLICATION CONTAINER
# =========================

- name: Run application container
  community.docker.docker_container:
    name: jiohotstar-web
    image: sonali0910/jiohotstar:latest
    networks:
      - name: jio-network
    ports:
      - "8081:5000"
    env:
      DATABASE_URL: postgresql://postgres:password@db:5432/jiohotstar
      SECRET_KEY: your-secret-key
    restart_policy: always
  tags: [docker]

# =========================
# 6. HEALTH CHECK
# =========================

- name: Wait for application to be healthy
  uri:
    url: "http://localhost:8081"
    status_code: 200
  register: health_check
  retries: 10
  delay: 5
  until: health_check.status == 200
  tags: [docker]

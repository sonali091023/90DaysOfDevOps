#Explicit network
networks:
  app-net:
    driver: bridge

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    labels:                
      tier: "database"
      project: "3-tier-app"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-net
    #restart: unless-stopped
    #restart: always
    restart: on-failure
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    labels:                
      tier: "cache"
      project: "3-tier-app"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - app-net
    #restart: unless-stopped
    #restart: always
    restart: on-failure
    volumes:
      - redis-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    labels:                
      tier: "web"
      project: "3-tier-app"
    depends_on:                       #Your web app will NOT start immediately It will wait until: db (Postgres) is healthy, redis is healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      REDIS_URL: redis://redis:6379/0
    networks:
      - app-net
    ports:
      - "8000:8000"
    #restart: unless-stopped
    #restart: always
    restart: on-failure
#Named volumes
volumes:
  pg-data:
  redis-data:
